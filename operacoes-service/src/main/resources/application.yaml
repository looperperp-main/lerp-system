spring:
  application:
    name: operacoes-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/loop-erp
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:3}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    web:
      pageable:
        max-page-size: 100
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS}

server:
  port: 8089
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: ${LOG_LEVEL:INFO}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

# URL lógica (Eureka) do cadastro-service p/ RestClient @LoadBalanced — validação de
# referências em lote e resolver de preço (spec/o2c-vendas.md §2/§6).
cadastro-service:
  url: lb://cadastro-service

# URL lógica (Eureka) do fiscal-service p/ RestClient @LoadBalanced — cálculo de IBS/CBS/IS/ISS
# de saída por item no faturamento (D4, spec/o2c-vendas.md §8).
fiscal-service:
  url: lb://fiscal-service

internal:
  gateway:
    secret: ${INTERNAL_GATEWAY_SECRET}

---
# Profile de produção: desabilita a documentação OpenAPI/Swagger
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
