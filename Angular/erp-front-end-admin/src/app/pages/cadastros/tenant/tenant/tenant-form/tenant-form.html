<p-dialog
  [(visible)]="visible"
  (onHide)="hideDialog()"
  [style]="{width: '450px'}"
  [modal]="true"
  styleClass="p-fluid">

  <ng-template pTemplate="header">
    <div class="jb-dialog-head">
      <span class="eyebrow">CADASTROS · TENANTS</span>
      <h2>{{ tenant.id ? 'Editar Tenant' : 'Novo Tenant' }}</h2>
    </div>
  </ng-template>

  <ng-template pTemplate="content">
    <div class="flex flex-col gap-2 mb-4 mt-2">
      <label for="name" class="jb-label">Nome</label>
      <input type="text" pInputText id="name" [(ngModel)]="tenant.name" required autofocus
             class="w-full"
             [ngClass]="{'ng-invalid ng-dirty': submitted && !tenant.name}" />
      <small class="text-red-500 text-xs" *ngIf="submitted && !tenant.name">O Nome é obrigatório.</small>
    </div>

    <div class="flex flex-col gap-2 mb-4">
      <label for="cnpj" class="jb-label">CNPJ</label>
      <p-inputmask
        id="cnpj"
        [(ngModel)]="tenant.cnpj"
        mask="99.999.999/9999-99"
        placeholder="00.000.000/0000-00"
        [required]="true"
        styleClass="w-full"
        [ngClass]="{'ng-invalid ng-dirty': submitted && (!tenant.cnpj || tenant.cnpj.replace('\\D', '').length !== 18)}">
      </p-inputmask>
      <small class="text-red-500 text-xs" *ngIf="submitted && !tenant.cnpj">O CNPJ é obrigatório.</small>
      <small class="text-red-500 text-xs" *ngIf="submitted && tenant.cnpj && tenant.cnpj.replace('\\D', '').length !== 18">O CNPJ deve estar completo.</small>
    </div>

    <div class="flex flex-col gap-2 mb-4" *ngIf="tenant.id">
      <label for="status" class="jb-label">Status</label>
      <p-select
        id="status"
        [(ngModel)]="tenant.status"
        [options]="statuses"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
        [style]="{'width':'100%'}">
      </p-select>
    </div>
  </ng-template>

  <ng-template pTemplate="footer">
    <button pButton pRipple label="Cancelar" icon="pi pi-times" class="p-button-secondary" (click)="hideDialog()"></button>
    <button pButton pRipple label="Salvar" icon="pi pi-check" (click)="onSave()"></button>
  </ng-template>
</p-dialog>
