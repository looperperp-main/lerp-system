<p-dialog [(visible)]="visible" [style]="{width: '450px'}" [modal]="true" styleClass="p-fluid">
  <ng-template pTemplate="header">
    <div class="jb-dialog-head">
      <span class="eyebrow">CADASTROS · ROLES</span>
      <h2>{{ role.id ? 'Editar Role' : 'Nova Role' }}</h2>
    </div>
  </ng-template>

  <ng-template pTemplate="content">
    <div class="flex flex-col gap-4 mt-2">

      <!-- Nome -->
      <div class="flex flex-col gap-2">
        <label for="name" class="jb-label">
          Nome da Role <span style="color: var(--bad);">*</span>
        </label>
        <input
          type="text"
          pInputText
          id="name"
          [(ngModel)]="role.name"
          required
          autofocus
          class="uppercase w-full"
          [ngClass]="{'ng-invalid ng-dirty': submitted && !role.name}"
          placeholder="Ex: ROLE_GERENTE"/>
        <small class="text-red-500 text-xs" *ngIf="submitted && !role.name">Nome é obrigatório.</small>
      </div>

      <!-- Tenant ID -->
      <div class="flex flex-col gap-2">
        <label for="tenantId" class="jb-label">
          Empresa (Tenant) <span style="color: var(--bad);">*</span>
        </label>

        <p-select
          id="tenantId"
          [options]="tenants"
          [(ngModel)]="role.tenantId"
          [appendTo]="'body'"
          optionLabel="name"
          optionValue="id"
          placeholder="Selecione um Tenant"
          styleClass="w-full"
          [ngClass]="{'ng-invalid ng-dirty': submitted && !role.tenantId}">
        </p-select>

        <small class="text-red-500 text-xs" *ngIf="submitted && !role.tenantId">O Tenant é obrigatório.</small>
      </div>

    </div>
  </ng-template>

  <ng-template pTemplate="footer">
    <button pButton pRipple label="Cancelar" icon="pi pi-times" class="p-button-secondary" (click)="hideDialog()"></button>
    <button pButton pRipple label="Salvar" icon="pi pi-check" (click)="onSave()"></button>
  </ng-template>
</p-dialog>
