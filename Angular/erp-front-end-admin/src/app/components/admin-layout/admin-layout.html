<div class="jb-app">

  <!-- Mobile Overlay Backdrop -->
  <div *ngIf="isMobile && !isCollapsed" class="fixed inset-0 bg-black/60 z-20" (click)="toggleSidebar()"></div>

  <!-- Sidebar -->
  <aside
    class="jb-sidebar
           w-64 flex-shrink-0
           lg:static lg:translate-x-0 lg:z-auto
           fixed inset-y-0 left-0 z-30 transform transition-transform duration-300"
    [class.-translate-x-full]="isMobile && isCollapsed"
    [class.translate-x-0]="isMobile && !isCollapsed"
  >

    <!-- Logo Area -->
    <div class="jb-sidebar-logo flex items-center justify-between">
      <span class="syax-logo">
        <span class="mark">S</span>
        syax
      </span>
      <!-- Close Button Mobile -->
      <button class="lg:hidden text-white" (click)="toggleSidebar()">
        <i class="pi pi-times"></i>
      </button>
    </div>

    <div class="jb-sidebar-label">Administração</div>

    <!-- Navigation -->
    <nav class="flex-1 overflow-y-auto custom-scrollbar">

      <div *ngFor="let item of menuItems">
        <!-- Main Item -->
        <div
          class="jb-nav-item"
          [class.active]="item?.['active'] || item.expanded"
          (click)="item.items ? toggleSubmenu(item) : null"
          [routerLink]="item.items ? null : item.routerLink"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{exact: false}"
        >
          <i [class]="item.icon"></i>
          <span>{{ item.label }}</span>

          <i *ngIf="item.items"
             class="pi pi-chevron-right chevron"
             [class.open]="item.expanded">
          </i>
        </div>

        <!-- Submenu Items -->
        <div *ngIf="item.items && item.expanded">
          <a *ngFor="let subItem of item.items"
             [routerLink]="subItem.routerLink"
             routerLinkActive="active"
             class="jb-nav-item sub">
            <i [class]="subItem.icon"></i>
            {{ subItem.label }}
          </a>
        </div>
      </div>

    </nav>

    <!-- Footer Sidebar (Logout) -->
    <div class="jb-sidebar-foot">
      <button (click)="logout()" class="jb-nav-item" style="width: 100%; border: 0; background: transparent; font: inherit;">
        <i class="pi pi-sign-out"></i>
        <span>Sair</span>
      </button>
    </div>
  </aside>

  <!-- Main Content Wrapper -->
  <div class="flex flex-col min-w-0 w-full">

    <!-- Topbar -->
    <header class="jb-topbar">

      <!-- Mobile Menu Button -->
      <button class="lg:hidden jb-icon-btn" (click)="toggleSidebar()">
        <i class="pi pi-bars"></i>
      </button>

      <!-- Search Bar -->
      <div class="jb-search hidden md:flex">
        <i class="pi pi-search" style="color: var(--muted)"></i>
        <input type="text" placeholder="Pesquisar tenants, usuários, parceiros...">
      </div>

      <!-- Right Actions -->
      <div class="flex items-center gap-3 ml-auto">

        <!-- Notification Bell -->
        <button class="jb-icon-btn">
          <i class="pi pi-bell"></i>
          <span class="dot"></span>
        </button>

        <!-- User Profile -->
        <div class="jb-user" (click)="toggleDropdown()">
          <span class="avatar">{{ user.name.charAt(0).toUpperCase() }}</span>
          <div class="meta">
            <b>{{ user.name }}</b>
            <span>{{ user.role }}</span>
          </div>
        </div>

      </div>
    </header>

    <!-- Breadcrumb -->
    <nav *ngIf="crumbs().length" aria-label="Breadcrumb" class="jb-crumbs">
      <a routerLink="/admin/home"><i class="pi pi-home" style="font-size: 11px;"></i></a>
      <ng-container *ngFor="let c of crumbs(); let last = last">
        <i class="pi pi-angle-right sep"></i>
        <span *ngIf="last" class="current">{{ c.label }}</span>
        <a *ngIf="!last" [routerLink]="c.link">{{ c.label }}</a>
      </ng-container>
    </nav>

    <!-- Scrollable Content -->
    <main class="jb-content flex-1">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
