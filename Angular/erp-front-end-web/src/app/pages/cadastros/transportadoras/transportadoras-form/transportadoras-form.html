<form [formGroup]="form" (ngSubmit)="save()" class="flex flex-col gap-4 mt-2">
  <div class="grid">

    <!-- Vinculo com Pessoa -->
    <div class="flex flex-col gap-2">
      <label for="pessoaId" class="jb-label">Pessoa Vinculada <span class="text-red-500">*</span></label>
      <p-select id="pessoaId" [options]="pessoasOptions()" formControlName="pessoaId"
                placeholder="Selecione uma pessoa" optionLabel="label" optionValue="value"
                [showClear]="true" [filter]="true" appendTo="body" [style]="{'width':'100%'}">
      </p-select>
    </div>

    <div class="flex flex-col gap-2 mt-2">
      <label for="rntrc" class="jb-label">RNTRC</label>
      <input pInputText id="rntrc" formControlName="rntrc" maxlength="8" placeholder="Ex: 12345678" class="w-full" />
      <small class="text-red-500" *ngIf="form.get('rntrc')?.invalid && (form.get('rntrc')?.dirty || form.get('rntrc')?.touched)">
        O RNTRC deve conter exatamente 8 dígitos numéricos.
      </small>
    </div>

    <!-- Modal -->
    <div class="flex flex-col gap-2 mt-2">
      <label for="modal" class="jb-label">Modal</label>
      <p-select
        id="modal"
        [options]="modalOptions"
        formControlName="modal"
        placeholder="Selecione um modal"
        optionLabel="label"
        optionValue="value"
        [showClear]="true"
        appendTo="body"
        [style]="{'width':'100%'}">
      </p-select>
    </div>

    <!-- Ativo -->
    <div class="flex items-center gap-2 mt-2">
      <p-checkbox
        inputId="ativo"
        formControlName="ativo"
        [binary]="true"></p-checkbox>
      <label for="ativo" class="jb-label cursor-pointer">Ativo</label>
    </div>

  </div>

  <div class="flex justify-end gap-2 mt-4">
    <button pButton type="button" label="Cancelar" icon="pi pi-times" class="p-button-text p-button-secondary" (click)="onCancel()"></button>
    <button pButton type="submit" label="Salvar" icon="pi pi-check" [disabled]="form.invalid"></button>
  </div>
</form>
