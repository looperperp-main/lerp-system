databaseChangeLog:

  # ──────────────────────────────────────────────────────────────────────────
  # emissao.webservice_endpoint / emissao.uf_autorizador — spec §3 item 12: "Configuração de
  # endpoint é dado, não código". autorizador é código livre (SVRS/PROPRIO_MG/PROPRIO_SP/SVC-AN),
  # não enum — aderir uma UF nova ao SVRS é mudança de dado, não de código.
  # ──────────────────────────────────────────────────────────────────────────
  - changeSet:
      id: "emissao-008-create-webservice-endpoint"
      author: vitor fernandes ferreira
      changes:
        - createTable:
            schemaName: emissao
            tableName: webservice_endpoint
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: documento
                  type: varchar(10)
                  constraints:
                    nullable: false
              - column:
                  name: autorizador
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: servico
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: versao
                  type: varchar(10)
                  constraints:
                    nullable: false
              - column:
                  name: url
                  type: varchar(500)
                  constraints:
                    nullable: false
              - column:
                  name: ambiente
                  type: varchar(15)
                  constraints:
                    nullable: false
              - column:
                  name: vigente_de
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: vigente_ate
                  type: date
      rollback:
        - dropTable:
            schemaName: emissao
            tableName: webservice_endpoint

  - changeSet:
      id: "emissao-009-create-uf-autorizador"
      author: vitor fernandes ferreira
      changes:
        - createTable:
            schemaName: emissao
            tableName: uf_autorizador
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: uf
                  type: varchar(2)
                  constraints:
                    nullable: false
              - column:
                  name: documento
                  type: varchar(10)
                  constraints:
                    nullable: false
              - column:
                  name: autorizador_normal
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: autorizador_contingencia
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: prazo_cancelamento_horas
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: vigente_de
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: vigente_ate
                  type: date
      rollback:
        - dropTable:
            schemaName: emissao
            tableName: uf_autorizador

  # ──────────────────────────────────────────────────────────────────────────
  # Seed PRODUCAO (emissao-010 a emissao-014) + seed HOMOLOGACAO (emissao-017 a emissao-020,
  # ao final deste arquivo) para os mesmos 4 autorizadores já usados pelas 5 UFs priorizadas —
  # URLs reais fornecidas pelo usuário em 25/09/2026, não inventadas.
  # ──────────────────────────────────────────────────────────────────────────
  - changeSet:
      id: "emissao-010-seed-uf-autorizador-nfe"
      author: vitor fernandes ferreira
      comment: 5 UFs priorizadas (emissao-fiscal.md §4.1) — todas caem em SVC-AN na contingência, todas 24h de prazo de cancelamento (§6)
      changes:
        - insert:
            schemaName: emissao
            tableName: uf_autorizador
            columns:
              - column: { name: id, valueComputed: "gen_random_uuid()" }
              - column: { name: uf, value: "RJ" }
              - column: { name: documento, value: "NFE" }
              - column: { name: autorizador_normal, value: "SVRS" }
              - column: { name: autorizador_contingencia, value: "SVC-AN" }
              - column: { name: prazo_cancelamento_horas, valueNumeric: 24 }
              - column: { name: vigente_de, valueDate: "2026-09-24" }
        - insert:
            schemaName: emissao
            tableName: uf_autorizador
            columns:
              - column: { name: id, valueComputed: "gen_random_uuid()" }
              - column: { name: uf, value: "DF" }
              - column: { name: documento, value: "NFE" }
              - column: { name: autorizador_normal, value: "SVRS" }
              - column: { name: autorizador_contingencia, value: "SVC-AN" }
              - column: { name: prazo_cancelamento_horas, valueNumeric: 24 }
              - column: { name: vigente_de, valueDate: "2026-09-24" }
        - insert:
            schemaName: emissao
            tableName: uf_autorizador
            columns:
              - column: { name: id, valueComputed: "gen_random_uuid()" }
              - column: { name: uf, value: "SC" }
              - column: { name: documento, value: "NFE" }
              - column: { name: autorizador_normal, value: "SVRS" }
              - column: { name: autorizador_contingencia, value: "SVC-AN" }
              - column: { name: prazo_cancelamento_horas, valueNumeric: 24 }
              - column: { name: vigente_de, valueDate: "2026-09-24" }
        - insert:
            schemaName: emissao
            tableName: uf_autorizador
            columns:
              - column: { name: id, valueComputed: "gen_random_uuid()" }
              - column: { name: uf, value: "MG" }
              - column: { name: documento, value: "NFE" }
              - column: { name: autorizador_normal, value: "PROPRIO_MG" }
              - column: { name: autorizador_contingencia, value: "SVC-AN" }
              - column: { name: prazo_cancelamento_horas, valueNumeric: 24 }
              - column: { name: vigente_de, valueDate: "2026-09-24" }
        - insert:
            schemaName: emissao
            tableName: uf_autorizador
            columns:
              - column: { name: id, valueComputed: "gen_random_uuid()" }
              - column: { name: uf, value: "SP" }
              - column: { name: documento, value: "NFE" }
              - column: { name: autorizador_normal, value: "PROPRIO_SP" }
              - column: { name: autorizador_contingencia, value: "SVC-AN" }
              - column: { name: prazo_cancelamento_horas, valueNumeric: 24 }
              - column: { name: vigente_de, valueDate: "2026-09-24" }
      rollback:
        - delete:
            schemaName: emissao
            tableName: uf_autorizador
            where: "documento = 'NFE'"

