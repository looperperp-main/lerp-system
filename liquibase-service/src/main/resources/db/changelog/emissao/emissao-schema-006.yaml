  # ──────────────────────────────────────────────────────────────────────────
  # NFS-e (Sistema Nacional NFS-e / ADN — Ambiente de Dados Nacional, §4.4 da spec) é REST/JSON,
  # autorizador nacional único (não por UF). URL fornecida pelo usuário em 25/09/2026 é a de
  # "Produção Restrita" da ADN — ambiente de testes, mapeado aqui em HOMOLOGACAO (não há URL de
  # produção real ainda).
  #
  # emissao-022 (uf_autorizador): EndpointResolverService.resolverUrl SEMPRE busca uf_autorizador
  # antes de webservice_endpoint (mesmo pra autorizador nacional único) — sem essa linha por UF,
  # a resolução de URL da NFS-e falha com BusinessException pra qualquer UF. autorizador_normal e
  # autorizador_contingencia apontam pro mesmo ADN (não há contingência distinta documentada
  # ainda). prazo_cancelamento_horas = 24 é PROVISÓRIO — regras-cancelamento-nfe.md só cobre NF-e;
  # a regra de cancelamento da ADN Nacional (por município, spec §4.4) ainda não foi levantada.
  # Não bloqueia homologação (nenhum efeito fiscal real), mas precisa de dado real antes da
  # etapa 5 ir a produção (§5 da spec principal).
  # ──────────────────────────────────────────────────────────────────────────
  - changeSet:
      id: "emissao-021-seed-webservice-endpoint-nfse-adn"
      author: vitor fernandes ferreira
      comment: ADN Nacional (NFS-e) — ambiente de Produção Restrita da Receita, tratado como HOMOLOGACAO
      changes:
        - insert:
            schemaName: emissao
            tableName: webservice_endpoint
            columns:
              - column: { name: id, valueComputed: "gen_random_uuid()" }
              - column: { name: documento, value: "NFSE" }
              - column: { name: autorizador, value: "ADN" }
              - column: { name: servico, value: "NFSE_RECEPCAO_DPS" }
              - column: { name: versao, value: "1.00" }
              - column: { name: url, value: "http://sefin.producaorestrita.nfse.gov.br/SefinNacional/nfse" }
              - column: { name: ambiente, value: "HOMOLOGACAO" }
              - column: { name: vigente_de, valueDate: "2026-09-25" }
      rollback:
        - delete:
            schemaName: emissao
            tableName: webservice_endpoint
            where: "documento = 'NFSE'"

