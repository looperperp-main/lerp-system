# ──────────────────────────────────────────
# Continuação da carga de regime por NCM — spec/anexos-lc214-revisar.md, item 7.5.
#
# Cobre os itens do backlog de 240 pendências que dava pra confirmar por texto integral da lei
# (spec/ANEXOS.md) e cruzar contra o que já está carregado (data/regime-lc214-v2.csv +
# fiscal-009/026/027). NÃO é a lista inteira — o que ficou de fora está documentado no rodapé
# deste arquivo e em spec/anexos-lc214-revisar.md (atualizado na mesma leva).
#
# REGIME NOVO — EXCECAO_INTEGRAL (percentual_reducao = 0):
# Vários itens dos anexos trazem "código X, EXCETO os subitens Y e Z" — Y/Z têm que sair
# tributados cheio, não com a redução do código guarda-chuva X. O motor casa por PREFIXO MAIS
# LONGO (TabelaFiscalJdbc#SQL_REGIME_NCM), então basta cadastrar Y/Z com um regime próprio de
# percentual_reducao=0 que os protege do prefixo largo de X.
#
# Por que não usar o literal 'PADRAO' (Constants.REGIME_DIF_PADRAO) pra essas linhas: PADRAO no
# motor não é "classificado, tributação cheia" — é "SEM linha em regime_dif_ncm", e dispara aviso
# de log + memória de cálculo avisando que o produto não está cadastrado (MotorFiscalService,
# ~linha 145). Se a exceção entrasse com regime='PADRAO', o motor acusaria falso positivo de
# "não cadastrado" pra um código que está, sim, classificado de propósito. EXCECAO_INTEGRAL entra
# como regime nomeado de verdade — mesmo efeito tributário (zero redução), sem o alarme falso.
#
# Quando a exceção pertence a OUTRO anexo já reduzido (não é tributação cheia), a linha entra com
# o regime daquele anexo, não com EXCECAO_INTEGRAL — ver Anexo XV item 2 (fiscal-047) e o próprio
# padrão já usado no fiscal-027.
# ──────────────────────────────────────────
