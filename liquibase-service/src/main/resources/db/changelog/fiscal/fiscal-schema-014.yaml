# ──────────────────────────────────────────
# Anexo XI item 2 (bens de defesa/segurança nacional) — releitura limpa de spec/ANEXOS.md linha 475
# em 01/09/2026 (a leva acima usava uma leitura comprimida, sem confiança pra esse trecho).
#
# Dos 30 subitens do item 2, a maioria NÃO é carregável com segurança por NCM sozinho: ou o código
# é um heading amplo com uso civil real no mesmo código (8709 viaturas/tratores industriais, 8701
# tratores agrícolas, 8802/8806 aeronaves e drones civis, 8804 paraquedas esportivos, 9014.20
# instrumento de navegação aérea civil, 2106.90.30 "outras preparações alimentícias", 9306 mistura
# munição militar com munição de caça/esporte — o mesmo risco já sinalizado pra heading 93.06), ou
# a distinção entre o bem e seu equivalente civil é só por FINALIDADE ("para uso pela segurança
# nacional"/"para uso militar"), que o NCM não carrega e o cadastro de produto não tem campo pra
# guardar (mesma limitação do ponto 6 abaixo). Isso vale também pros itens 2.22-2.30 (dispositivos
# de segurança da informação/cibernética — IPS, firewall, switch seguro, storage criptografado):
# os NCM citados (8517.62.x, 8471.49/50/90, 8523.51/52) são classificações genéricas de hardware de
# rede/TI, carregar cru daria redução pra QUALQUER switch/servidor/SSD comum, não só o de segurança.
#
# Só entram os subitens cujo próprio HEADING do NCM é exclusivo de material bélico/militar (sem
# equivalente civil classificado no mesmo código, verificado subitem a subitem contra a nomenclatura
# oficial), então dá pra carregar sem o campo de finalidade que falta:
#   - 2.2  8710.00.00 — carro de combate/blindado de combate (heading 87.10 é só isso)
#   - 2.7  9301.20.00 — lançador de foguete/arma de guerra (heading 93.01 exclui armas civis por
#     definição, ao contrário do 93.06)
#   - 2.17 8805.10.00 — catapulta/gancho de aterrissagem em porta-aviões (uso naval/militar)
#   - 2.18 8805.21.00 — simulador de COMBATE aéreo (o "de combate" restringe; não é o simulador de
#     voo civil de 8805.29, que fica de fora de propósito)
#   - 2.21 8906.10.00 — navio de guerra (o outro código do mesmo item, 8901.20.00 tanque-navio
#     comercial, fica de fora — não é bem de defesa)
# Regime reaproveitado: ANEXO_XI_60 (mesmo nome já usado no fiscal-007 pro lado serviço/cClassTrib
# 200043/200044 — mesmo anexo, mesma redução de 60%, tabela diferente).
  - changeSet:
      id: fiscal-048-seed-anexo-xi-bens-defesa
      author: vitor-fernandes
      comment: Anexo XI item 2 — só os NCM exclusivamente militares (carro de combate, arma de guerra, lançamento/aterrissagem em porta-aviões, simulador de combate aéreo, navio de guerra)
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: >
              INSERT INTO fiscal.regime_dif_ncm (ncm, descricao, regime, percentual_reducao, vigente_de) VALUES
                ('87100000', 'Carro de combate/blindado de combate - Anexo XI item 2.2', 'ANEXO_XI_60', 60, DATE '2027-01-01'),
                ('93012000', 'Lançador de foguete/arma de guerra - Anexo XI item 2.7', 'ANEXO_XI_60', 60, DATE '2027-01-01'),
                ('88051000', 'Catapulta/gancho de aterrissagem em porta-aviões - Anexo XI item 2.17', 'ANEXO_XI_60', 60, DATE '2027-01-01'),
                ('88052100', 'Simulador de combate aéreo - Anexo XI item 2.18', 'ANEXO_XI_60', 60, DATE '2027-01-01'),
                ('89061000', 'Navio de guerra - Anexo XI item 2.21', 'ANEXO_XI_60', 60, DATE '2027-01-01');
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: >
              DELETE FROM fiscal.regime_dif_ncm WHERE ncm IN (
                '87100000','93012000','88051000','88052100','89061000');

# ──────────────────────────────────────────
# O QUE FICOU DE FORA DESTA LEVA (não silenciado — documentado em spec/anexos-lc214-revisar.md):
#
# 1. Crosswalk NBS <-> item LC 116 (~143 itens, Anexos II/III/X/XI serviços): não muda o cálculo —
#    regime_cclasstrib já cobre a redução por cClassTrib (fiscal-019). É concern de cadastro/UI,
#    sem fonte confiável em repo pra montar o de/para sem risco de inventar código.
#
# 2. Anexo XI, lado PRODUTO — releitura feita (ver changeset fiscal-048 acima); 5 dos 30 subitens
#    entraram (heading exclusivamente militar, sem risco de pegar equivalente civil). Os outros 25
#    ficam pendentes por finalidade não verificável pelo NCM (viaturas/tratores/aeronaves/drones de
#    uso duplo civil-militar, munição do heading 93.06, hardware de rede/TI genérico dos itens
#    2.22-2.30) — mesma limitação estrutural do ponto 6 abaixo, não falta de fonte.
#
#    Item 2.5 (trator p/ Segurança Pública/Forças Armadas, NCM 8701) checado via web em
#    01/09/2026 — não é falta de leitura, é confirmado: o próprio texto oficial da lei cita só o
#    heading genérico "8701" (normaslegais.com.br/legislacao/anexos-XI-a-XV-lc-214.htm), e a NCM
#    não tem subposição de trator militar — 8701.10/20/30/9x classificam por tipo mecânico
#    (eixo único, rodoviário, lagartas) e por potência do motor, nunca por uso (ncm.fazcomex.com.br
#    /8701-tratores-exceto-os-carrostratores-da-posicao-8709/). Carregar "8701" cru daria 60% pra
#    qualquer trator agrícola/florestal/de obra vendido no país. Fica pendente por desenho — não
#    adianta reler o texto de novo, o gap é estrutural (falta campo de finalidade no cadastro).
#
# 3. Anexo XVII (Imposto Seletivo): bloqueado por lei ordinária ainda não editada.
#
# 4. Anexo IX item 3 (capítulo 25 inteiro): capítulo cobre de gesso agrícola a cimento/cal
#    industrial — largo demais pra tomar ao pé da letra sem uma subposição mais específica.
#
# 5. Anexo IX itens 7/8 (listas grandes de insumo agropecuário): parcialmente já cobertos por
#    outros anexos ao mesmo 60% (ex. 2915.21.00, 3824.99.89) só que sob rótulo de anexo diferente
#    — sem impacto tributário real, mas o resto da lista precisa de curadoria código a código que
#    não coube nesta leva.
#
# 6. Anexo IX itens 12/13/18/19/20/21 e o restante do item 14/19 do Anexo VII ("frutas de casca
#    rija não regionais", "exceto animais domésticos", "exceto ornamentais"): distinção por
#    ORIGEM ou USO FINAL, não por código NCM — o mesmo código atende os dois casos. Não dá pra
#    resolver sem campo de origem/uso no cadastro de produto.
#
# 7. Anexo XII item 1 e Anexo XIII itens 2/3/5/6: já estavam carregados (conferido nesta sessão
#    contra data/regime-lc214-v2.csv) — o backlog original os listava por artefato do extrator,
#    não por lacuna real. anexos-lc214-revisar.md foi atualizado pra refletir isso.
#
# 8. Os 2 conflitos de NCM em dois anexos já documentados no fiscal-009 (21069090, 25010090) não
#    foram mexidos — mesma limitação de sempre, entram pela redução maior (Anexo I) de propósito.
# ──────────────────────────────────────────
