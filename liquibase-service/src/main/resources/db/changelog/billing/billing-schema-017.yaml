databaseChangeLog:
  - changeSet:
      id: "017-job-execution"
      author: vitor fernandes ferreira
      comment: "Histórico de execução dos jobs agendados (runner de diagnóstico #5): grava início/fim/status/duração de cada execução — manual (botão do admin) ou cron. Persiste o que antes ficava só em memória (perdia no restart e não somava entre réplicas)."
      changes:
        - createTable:
            schemaName: billing
            tableName: job_execution
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: job_key
                  type: VARCHAR(60)
                  remarks: "chave lógica do job (reconciliation, dunning, ...) — casa com a tela de jobs do admin"
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  remarks: "EXECUTANDO enquanto roda; OK ou ERRO ao terminar"
                  constraints:
                    nullable: false
              - column:
                  name: started_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: finished_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: true
              - column:
                  name: duration_ms
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: error_message
                  type: TEXT
                  constraints:
                    nullable: true
        - createIndex:
            schemaName: billing
            tableName: job_execution
            indexName: idx_job_execution_key_started
            columns:
              - column:
                  name: job_key
              - column:
                  name: started_at
                  descending: true
      rollback:
        - dropTable:
            schemaName: billing
            tableName: job_execution
