global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'auth-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      #- targets: ['auth-service:8085']  # Ajuste a porta conforme seu serviço
      - targets: ['host.docker.internal:8085']  # Ajuste a porta conforme seu serviço

  - job_name: 'cadastro-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      #- targets: ['cadastro-service:8086']  # Ajuste a porta conforme seu serviço
      - targets: ['host.docker.internal:8086']  # Ajuste a porta conforme seu serviço

  - job_name: 'gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      #- targets: ['gateway:8090']  # Ajuste a porta conforme seu serviço
      - targets: ['host.docker.internal:8090']  # Ajuste a porta conforme seu serviço

  - job_name: 'partner-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      #- targets: ['partner-service:8087']
      - targets: ['host.docker.internal:8087']

  # billing expõe as métricas de webhook (webhook_processado_total / webhook_pendente)
  - job_name: 'billing-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      #- targets: ['billing-service:8088']
      - targets: ['host.docker.internal:8088']