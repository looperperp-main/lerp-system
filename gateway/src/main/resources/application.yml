spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth/**
            - id: partner-service
              uri: lb://partner-service
              predicates:
                - Path=/partner/**
              filters:
                - StripPrefix=1
            - id: billing-service
              uri: lb://billing-service
              predicates:
                - Path=/billing/**
              filters:
                - StripPrefix=1
            - id: operacoes-service
              uri: lb://operacoes-service
              predicates:
                - Path=/api/v1/pedidos/**,/api/v1/compras/**,/api/v1/estoque/**
            - id: cadastro-service
              uri: lb://cadastro-service
              predicates:
                - Path=/api/**
            - id: fiscal-service
              uri: lb://fiscal-service
              predicates:
                - Path=/fiscal/**

rate-limit:
  replenish-rate: 20
  burst-capacity: 40

gateway:
  # IP(s) real(is) do LB/nginx em produção, separados por vírgula. Vazio (default) = nunca
  # confia em X-Forwarded-For, sempre usa o IP de conexão real — seguro em dev local sem
  # configurar nada. Em prod, setar via env var pro(s) IP(s) exato(s) do proxy, nunca uma
  # faixa de rede inteira (spec/auditoria.md §7.2).
  trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:}

server:
  port: 8090

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    root: INFO

api:
  security:
    jwt:
      secret: ${JWT_SECRET}

internal:
  gateway:
    secret: ${INTERNAL_GATEWAY_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics"
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
#cors.allowed-origins=http://localhost:4200,http://localhost:4201
#cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
#cors.allowed-headers=Authorization,Content-Type
#cors.allow-credentials=true
