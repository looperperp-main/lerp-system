apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  # Substitui o Kibana: os logs dos 6 serviços chegam aqui via loki4j (push HTTP direto).
  # Explore > Loki > ex.: {app="billing-service"} |= "PAYMENT_RECEIVED"
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true